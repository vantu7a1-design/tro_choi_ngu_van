<!DOCTYPE html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khám phá tinh thần yêu nước</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3e9;color:#243b3b;font:18px/1.6 system-ui,sans-serif}header{background:#164b46;color:white;padding:35px max(5vw,20px)}header small{color:#f1d68c}h1{font-size:clamp(26px,4vw,44px);margin:8px 0}main{max-width:1180px;margin:auto;padding:24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}button{font:inherit;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:#e4ebe5;color:#164b46}button.active,.primary{background:#176a5d;color:white}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;border:1px solid #e3e3d8;border-radius:20px;padding:24px}h2{margin:0 0 8px;font-size:24px}h3{font-size:18px;margin:0 0 10px}.card{display:block;width:100%;text-align:left;background:#fff8e5;border:2px solid #eddba8;padding:15px;border-radius:12px;margin:12px 0;cursor:grab;color:#283d3c}.card.selected{border-color:#176a5d;box-shadow:0 0 0 3px #d6ebe4}.slot{min-height:110px;border:2px dashed #aac7bf;border-radius:14px;padding:14px;margin:14px 0;background:#f4faf7}.slot.over{background:#d4eee3}.slot.correct{border:2px solid #208156}.slot.wrong{border:2px solid #d36b45;background:#fff3ed}.slot .card{margin:8px 0;background:white}.caption{font-size:14px;color:#63776f}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.result{padding:18px;border-radius:12px;background:#e7f2eb;margin-bottom:20px}.hidden{display:none}footer{font-size:14px;color:#6c776e;padding:20px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:15px}.panel{padding:18px}}</style><header><small>NGỮ VĂN • TRÒ CHƠI KÉO – THẢ</small><h1>Tinh thần yêu nước<br>của nhân dân ta</h1><div>Nhận diện luận điểm · Kết nối lập luận · Xác định luận đề</div></header><main><nav id="nav"></nav><h2 id="title"></h2><p id="instruction"></p><div id="feedback" role="status" aria-live="polite"></div><div class="layout"><section class="panel"><h3>Thẻ thông tin</h3><div class="caption">Kéo thẻ vào ô phù hợp. Hoặc chọn thẻ rồi nhấn vào ô đích.</div><div id="bank" class="slot" aria-label="Trả thẻ về kho"></div></section><section class="panel"><h3 id="targetTitle">Ghép vào vị trí phù hợp</h3><div id="targets"></div></section></div><div class="actions"><button class="primary" id="check">Kiểm tra đáp án</button><button id="reset">Làm lại phần này</button><button id="next">Phần tiếp theo →</button></div><footer>Nội dung trò chơi được xây dựng từ thông tin bài học đã cung cấp.</footer></main><script>
const levels=[{name:'1. Luận điểm chính',title:'Xác định ba luận điểm chính',instruction:'Ghép nội dung của mỗi luận điểm với đúng vị trí trong văn bản.',labels:['Luận điểm 1 • Từ đầu đến “nó nhấn chìm tất cả lũ bán nước và lũ cướp nước”.','Luận điểm 2 • Từ “Lịch sử ta đã có nhiều cuộc kháng chiến vĩ đại” đến “nhưng đều giống nhau nơi lòng nồng nàn yêu nước”.','Luận điểm 3 • Phần còn lại.'],cards:['Nêu vấn đề tinh thần yêu nước của nhân dân ta.','Truyền thống yêu nước của nhân dân ta thể hiện qua lịch sử đấu tranh giữ nước xưa kia và qua cuộc kháng chiến chống thực dân Pháp ngày nay.','Cần tiếp tục phát huy tinh thần yêu nước quý báu của nhân dân.'],explain:'Luận điểm 1 nêu vấn đề; luận điểm 2 làm sáng tỏ truyền thống yêu nước; luận điểm 3 nêu yêu cầu tiếp tục phát huy truyền thống ấy.'},{name:'2. Quan hệ lập luận',title:'Kết nối mối quan hệ giữa các luận điểm',instruction:'Ghép từng vai trò với luận điểm tương ứng để thấy cách văn bản triển khai lập luận.',labels:['Vai trò của luận điểm 1','Vai trò của luận điểm 2','Vai trò của luận điểm 3'],cards:['Có tính chất khái quát.','Làm sáng tỏ điều khẳng định ở luận điểm 1.','Nêu phương hướng hành động trên cơ sở rút ra nhận thức từ hai luận điểm trước đó.'],explain:'Mạch lập luận: khái quát vấn đề → làm sáng tỏ vấn đề → nêu phương hướng hành động.'},{name:'3. Nội dung bao quát',title:'Xác định nội dung bao quát và luận đề',instruction:'Ghép ba thẻ để hoàn thiện cách hiểu về nội dung bao quát của văn bản.',labels:['Các luận điểm triển khai nội dung như thế nào?','Ba luận điểm có quan hệ như thế nào?','Nội dung bao trùm, thể hiện ở nhan đề và cũng là luận đề của văn bản'],cards:['Từng luận điểm nêu các khía cạnh cụ thể.','Ba luận điểm có quan hệ chặt chẽ với nhau, cùng hướng tới nội dung bao trùm.','Tinh thần yêu nước của nhân dân ta.'],explain:'“Tinh thần yêu nước của nhân dân ta” là nội dung bao quát, được thể hiện ở nhan đề và cũng là luận đề của văn bản.'}];
let current=0,selected=null,states=levels.map(l=>({places:l.cards.map(()=>-1),checked:false}));const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let orders=levels.map(l=>shuffle(l.cards.map((_,i)=>i)));function move(id,dest){if(dest>=0)states[current].places.forEach((p,i)=>{if(p===dest)states[current].places[i]=-1});states[current].places[id]=dest;states[current].checked=false;selected=null;render()}function dropzone(el,dest){el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();e.stopPropagation();const id=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(id)&&id>=0&&id<levels[current].cards.length)move(id,dest)};el.onclick=()=>{if(selected!==null)move(selected,dest)};el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&selected!==null){e.preventDefault();move(selected,dest)}}}function card(i){let b=document.createElement('button');b.className='card'+(selected===i?' selected':'');b.textContent=levels[current].cards[i];b.draggable=true;b.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'};b.onclick=e=>{e.stopPropagation();selected=selected===i?null:i;render()};return b}function render(){let l=levels[current],s=states[current];$('nav').replaceChildren(...levels.map((x,i)=>{let b=document.createElement('button');b.textContent=x.name;b.className=i===current?'active':'';b.onclick=()=>{current=i;selected=null;render()};return b}));$('title').textContent=l.title;$('instruction').textContent=l.instruction;$('bank').replaceChildren(...orders[current].filter(i=>s.places[i]===-1).map(card));dropzone($('bank'),-1);$('targets').replaceChildren(...l.labels.map((t,j)=>{let d=document.createElement('div');d.className='slot';d.tabIndex=0;d.setAttribute('aria-label',t);let label=document.createElement('strong');label.textContent=t;d.append(label);let i=s.places.indexOf(j);if(i>=0)d.append(card(i));else{let p=document.createElement('div');p.className='caption';p.textContent='Thả thẻ vào đây';d.append(p)}if(s.checked)d.classList.add(i===j?'correct':'wrong');dropzone(d,j);return d}));$('feedback').className=s.checked?'result':'';let score=s.places.filter((p,i)=>p===i).length;$('feedback').textContent=s.checked?(score===3?'Chính xác! 3/3 thẻ đúng. '+l.explain:'Đúng '+score+'/3 thẻ. Ô màu cam cần điều chỉnh. Hãy đọc lại nội dung và thử ghép lại.') :'';$('next').textContent=current===2?'Quay lại phần 1 ↻':'Phần tiếp theo →'}$('check').onclick=()=>{states[current].checked=true;render()};$('reset').onclick=()=>{states[current]={places:[-1,-1,-1],checked:false};orders[current]=shuffle([0,1,2]);selected=null;render()};$('next').onclick=()=>{current=(current+1)%3;selected=null;render()};render();
</script></html>
